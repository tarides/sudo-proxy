name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The Rust toolchain (and the clippy/rustfmt components) is pinned by
# rust-toolchain.toml; rustup installs it automatically on the first cargo
# invocation, so the compiling jobs below need no explicit toolchain step.

jobs:
  lint:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # --all-features enables `mcp`, so the MCP server is linted too.
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Core build (no MCP) guards the --no-default-features path used by release.yml.
      - run: cargo build --release --no-default-features
      # Default build now includes `mcp`, so this builds all binaries.
      - run: cargo build --release
      # `mcp` is a default feature, so tests/hosts.rs runs without an extra flag.
      # TODO: drop the --skip once "Stabilize the flaky S2 resource-cap test"
      # (backlog.md) lands — burst_connections_above_cap_get_busy_response is
      # timing-flaky in its setup assertion, not its security assertion.
      - run: cargo test -- --skip burst_connections_above_cap_get_busy_response

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-audit
      # Ignores mirror deny.toml [advisories].ignore, which documents the
      # rationale for each: 0189 and 0462 are rmcp HTTP-transport issues
      # (sudo-proxy serves over stdio only); 0543 is chrono's unmaintained
      # notice (pulled in by rmcp, no patched version).
      - run: cargo audit --ignore RUSTSEC-2026-0189 --ignore RUSTSEC-2026-0462 --ignore RUSTSEC-2026-0543

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check

  geiger:
    name: cargo geiger (unsafe surface, informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-geiger
      # Informational only: geiger exits non-zero whenever it finds `unsafe`
      # (this crate has plenty), so the step is allowed to fail without
      # gating the build — the report stays visible in the job log.
      - run: cargo geiger --all-features
        continue-on-error: true
