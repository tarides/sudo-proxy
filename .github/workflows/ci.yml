name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The Rust toolchain (and the clippy/rustfmt components) is pinned by
# rust-toolchain.toml; rustup installs it automatically on the first cargo
# invocation, so the compiling jobs below need no explicit toolchain step.

jobs:
  lint:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      # --all-features enables `mcp`, so the MCP server is linted too.
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      # Core build (no MCP) guards the --no-default-features path used by release.yml.
      - run: cargo build --release --no-default-features
      # Default build now includes `mcp`, so this builds all binaries.
      - run: cargo build --release
      # `mcp` is a default feature, so tests/hosts.rs runs without an extra flag.
      # TODO: drop the --skip once "Stabilize the flaky S2 resource-cap test"
      # (backlog.md) lands — burst_connections_above_cap_get_busy_response is
      # timing-flaky in its setup assertion, not its security assertion.
      - run: cargo test -- --skip burst_connections_above_cap_get_busy_response

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  geiger:
    name: cargo geiger (unsafe surface, informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-geiger
      # Informational only: geiger exits non-zero whenever it finds `unsafe`
      # (this crate has plenty), so the step is allowed to fail without
      # gating the build — the report stays visible in the job log.
      - run: cargo geiger --all-features
        continue-on-error: true
