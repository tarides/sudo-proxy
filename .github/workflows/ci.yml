name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # --all-features enables `mcp`, so the MCP server is linted too.
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Core build (no MCP) guards the no-feature path used by release.yml.
      - run: cargo build --release
      - run: cargo build --release --features mcp
      # --features mcp is required for tests/hosts.rs.
      # TODO: drop the --skip once "Stabilize the flaky S2 resource-cap test"
      # (backlog.md) lands — burst_connections_above_cap_get_busy_response is
      # timing-flaky in its setup assertion, not its security assertion.
      - run: cargo test --features mcp -- --skip burst_connections_above_cap_get_busy_response

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  geiger:
    name: cargo geiger (unsafe surface, informational)
    runs-on: ubuntu-latest
    # Non-blocking: reports the unsafe surface without gating the build.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-geiger
      - run: cargo geiger --all-features
