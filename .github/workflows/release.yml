name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain + MUSL target
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add x86_64-unknown-linux-musl

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build core binaries (no MCP)
        run: cargo build --release --target x86_64-unknown-linux-musl --no-default-features

      - name: Build all binaries (with MCP)
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Package tarball
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          DIR="sudo-proxy-${TAG}-x86_64-linux"
          mkdir "$DIR"
          cp target/x86_64-unknown-linux-musl/release/sudo-proxy \
             target/x86_64-unknown-linux-musl/release/sudo-request \
             target/x86_64-unknown-linux-musl/release/pkexec-cache \
             target/x86_64-unknown-linux-musl/release/sudo-proxy-mcp \
             "$DIR/"
          tar czf "${DIR}.tar.gz" "$DIR"
          echo "TARBALL=${DIR}.tar.gz" >> "$GITHUB_ENV"

      - name: Install rsign2 (minisign signer)
        run: cargo install rsign2 --locked

      - name: Sign tarball (minisign)
        run: |
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > minisign.key
          rsign sign -W -s minisign.key -x "${TARBALL}.sig" \
            -t "sudo-proxy ${GITHUB_REF#refs/tags/} release" \
            "$TARBALL"
          rm -f minisign.key
          rsign verify -P "$MINISIGN_PUBKEY" -x "${TARBALL}.sig" "$TARBALL"
          echo "SIGNATURE=${TARBALL}.sig" >> "$GITHUB_ENV"
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PUBKEY: RWT7gwtBU0v4puI76u0oYwMAT9nmYwGimSOnqJJ+kHExsjTDQj1eZkMW

      - name: Create GitHub Release
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" "$TARBALL" "$SIGNATURE" \
            --title "$TAG" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
