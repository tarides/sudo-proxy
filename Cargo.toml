[package]
name = "sudo-proxy"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sudo-proxy"
path = "src/bin/sudo-proxy.rs"

[[bin]]
name = "sudo-request"
path = "src/bin/sudo-request.rs"

[[bin]]
name = "pkexec-cache"
path = "src/bin/pkexec-cache.rs"

[[bin]]
name = "sudo-proxy-mcp"
path = "src/bin/sudo-proxy-mcp.rs"

[lib]
name = "sudo_proxy"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
rmcp = { version = "0.11", features = ["transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
schemars = "1"
