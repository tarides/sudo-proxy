[package]
name = "sudo-proxy"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Privileged command execution proxy with human approval via pkexec or sudo"
repository = "https://github.com/tarides/sudo-proxy"
homepage = "https://github.com/tarides/sudo-proxy"
readme = "README.md"
keywords = ["sudo", "pkexec", "privilege", "proxy", "mcp"]
categories = ["command-line-utilities", "authentication"]

[[bin]]
name = "sudo-proxy"
path = "src/bin/sudo-proxy.rs"

[[bin]]
name = "sudo-request"
path = "src/bin/sudo-request.rs"

[[bin]]
name = "pkexec-cache"
path = "src/bin/pkexec-cache.rs"

[[bin]]
name = "sudo-proxy-mcp"
path = "src/bin/sudo-proxy-mcp.rs"
required-features = ["mcp"]

[lib]
name = "sudo_proxy"
path = "src/lib.rs"

# `mcp` is on by default so `cargo install sudo-proxy` builds the
# `sudo-proxy-mcp` binary (the MCP Registry's cargo install path uses no extra
# flags). Build the core binaries alone with `--no-default-features`.
[features]
default = ["mcp"]
mcp = ["dep:rmcp", "dep:tokio", "dep:schemars"]

[lints.rust]
# `kani` is set by the Kani model checker (cargo kani), never by a normal
# build. Register it so the `-D warnings` clippy gate doesn't trip over the
# `#[cfg(kani)]` proof module. See src/proofs.rs and docs/formalisation-roadmap.md.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
rmcp = { version = "0.15", features = ["transport-io"], optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"], optional = true }
schemars = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"
