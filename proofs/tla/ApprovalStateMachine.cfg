\* TLC model for the Rung 4 approval state machine. See README.md.
\* Run:  java -cp tla2tools.jar tlc2.TLC -config ApprovalStateMachine.cfg \
\*            -workers auto ApprovalStateMachine.tla

CONSTANTS
    \* Two ids: the minimum to express both "replay the same id" and
    \* "two distinct ids". TLC model values.
    Ids = {r1, r2}

SPECIFICATION Spec

INVARIANTS
    TypeOK
    NoExecWithoutApproval
    ReplayImpossible
    PolicyFlipsOnlyOnKeypress
    PrivilegedGateIndependentOfPolicy

PROPERTIES
    FlagMonotone
