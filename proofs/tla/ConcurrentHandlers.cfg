\* TLC model for the Extended Rung 4 concurrent-handler interleaving model.
\* See README.md.
\* Run:  java -cp tla2tools.jar tlc2.TLC -config ConcurrentHandlers.cfg \
\*            -workers auto ConcurrentHandlers.tla

CONSTANTS
    \* Two concurrent handlers: the minimum that exposes the pairwise dedup
    \* TOCTOU and the TTY-lock race. A third only adds symmetric interleavings.
    Handlers = {h1, h2}
    \* Two ids: lets two handlers race the SAME id (the TOCTOU) and also handle
    \* two distinct ids. TLC model values.
    Ids = {r1, r2}

SPECIFICATION Spec

INVARIANTS
    TypeOK
    NoDoubleExec
    TtyMutualExclusion
