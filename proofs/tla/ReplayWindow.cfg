\* TLC model for the Extended Rung 4 freshness <-> replay window-sizing proof.
\* See README.md ("Window-sizing").
\* Run:  java -cp tla2tools.jar tlc2.TLC -nowarning \
\*            -config ReplayWindow.cfg -workers auto ReplayWindow.tla

CONSTANTS
    \* One id: the property is per-id; the two-distinct-ids interaction is
    \* covered by the sibling ApprovalStateMachine model. A TLC model value.
    Ids = {r1}
    \* The window relationship is what matters, not the absolute seconds.
    \* Shipped config: Retention = 2 * Freshness (real code: 120s = 2 * 60s).
    Freshness = 2
    Retention = 4
    \* Clock horizon: must reach an insertion + Retention so eviction (and a
    \* post-eviction replay) is exercised; 6 gives headroom over 2*Freshness.
    MaxTime = 6

SPECIFICATION Spec

INVARIANTS
    TypeOK
    PastReplayImpossible
    AcceptWasFresh
